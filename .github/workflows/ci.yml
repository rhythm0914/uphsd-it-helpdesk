name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Cloudflare/vinext)
        run: npm run build:vinext

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Applies schema.sql and every migration to an in-process Postgres
      # (PGlite), then asserts the workflow rules. No Supabase project, no
      # secrets, no service container. The second run corrupts three invariants
      # on purpose and fails if the verifier does not notice, so these checks
      # cannot quietly stop checking anything.
      - name: Verify migrations and SQL behaviour
        run: npm run verify:sql && npm run verify:sql -- --mutation-test
