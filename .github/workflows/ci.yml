name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vinext needs Node >= 22: it imports `glob` from node:fs/promises,
          # which Node 20 does not export. On 20 the build dies with
          # "does not provide an export named 'glob'" before anything else runs.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (Cloudflare/vinext)
        run: npm run build:vinext

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Applies schema.sql and every migration to an in-process Postgres
      # (PGlite), then asserts the workflow rules. No Supabase project, no
      # secrets, no service container. The second run corrupts three invariants
      # on purpose and fails if the verifier does not notice, so these checks
      # cannot quietly stop checking anything.
      - name: Verify migrations and SQL behaviour
        run: npm run verify:sql && npm run verify:sql -- --mutation-test

      # Playwright E2E tests against a seeded Supabase project. Requires
      # E2E_STUDENT_A_EMAIL/PASSWORD, E2E_STUDENT_B_EMAIL/PASSWORD and
      # E2E_STAFF_EMAIL/PASSWORD secrets plus a seeded database.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_STUDENT_A_EMAIL: ${{ secrets.E2E_STUDENT_A_EMAIL }}
          E2E_STUDENT_A_PASSWORD: ${{ secrets.E2E_STUDENT_A_PASSWORD }}
          E2E_STUDENT_B_EMAIL: ${{ secrets.E2E_STUDENT_B_EMAIL }}
          E2E_STUDENT_B_PASSWORD: ${{ secrets.E2E_STUDENT_B_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          PLAYWRIGHT_BASE_URL: http://localhost:3000
